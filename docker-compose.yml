version: '3.8'

services:
  blazor:
    build:
      context: ./blazor
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    depends_on:
      - mssql

  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      - SA_PASSWORD=YourStrong@Passw0rd
      - ACCEPT_EULA=Y
    ports:
      - "1433:1433"
