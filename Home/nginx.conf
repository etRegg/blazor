events { }
http {
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    server {
        listen 80;
        index index.html;
        root /usr/share/nginx/html;

        location / {
            try_files $uri $uri/ /index.html =404;
            error_page 405 =200 $uri;
        }

        error_page 405 =200 /index.html;
    }
}
